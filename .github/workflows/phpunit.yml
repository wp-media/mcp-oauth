name: PHPUnit

on:
  pull_request:
  # Allow manually triggering the workflow.
  workflow_dispatch:

# Cancel all previous workflow runs for the same branch that have not yet completed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Report every PHP version independently instead of cancelling the whole
      # matrix on the first failing leg.
      fail-fast: false
      matrix:
        # Supported range: floor (composer "php": ">=7.4") through the latest
        # stable release. Add a new entry when a new PHP version ships.
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup PHP + Composer
      uses: wp-media/workflows/.github/actions/setup-php-composer@main
      with:
        php-version: ${{ matrix.php }}
        ini-values: 'memory_limit=1G'

    - name: Setup WordPress test suite
      uses: wp-media/workflows/.github/actions/setup-wp-tests@main
      with:
        wp-version: latest

    - name: Setup problem matchers for PHP
      run: echo "::add-matcher::${{ runner.tool_cache }}/php.json"

    - name: Setup problem matchers for PHPUnit
      run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

    - name: Run PHPUnit unit tests
      run: composer test-unit

    - name: Run PHPUnit integration tests
      run: composer test-integration
